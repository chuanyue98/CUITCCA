name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 后端测试矩阵：Python 3.12 / 3.13 并行执行 lint + typecheck + test + coverage
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --python ${{ matrix.python-version }}

      - name: Lint with ruff
        run: uv run ruff check backend/ tests/ scripts/

      - name: Type check with mypy
        run: uv run mypy backend/app/ tests/ --ignore-missing-imports

      - name: Run tests with coverage
        run: uv run pytest tests/ -v --cov=backend/app --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          flags: py${{ matrix.python-version }}

  # 前端构建校验：TypeScript 类型检查 + 生产构建（产物到 backend/app/static）
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check with tsc
        run: npx tsc --noEmit

      - name: Unit tests with vitest
        run: npm run test

      - name: Build
        run: npm run build

  # 安全扫描：复用 Makefile security 目标的两条命令（pip-audit + bandit）
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: pip-audit (scan Python deps for known CVEs)
        run: uv run pip-audit --ignore-vuln PYSEC-2026-311  # chromadb 1.5.9, no fix available yet

      - name: bandit (static security analysis of backend source)
        run: uv run bandit -r backend/app/ -ll
