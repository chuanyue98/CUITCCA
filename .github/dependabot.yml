version: 2
updates:
  # Python 依赖（pyproject.toml / uv.lock）
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # 开发依赖合并为一个 PR，减少噪音
      python-dev-deps:
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"
          - "pip-audit"
          - "bandit"
      # 运行时依赖的 minor/patch 更新合并
      python-runtime-deps:
        update-types:
          - "minor"
          - "patch"

  # 前端依赖（frontend/package.json）
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      npm-dev-deps:
        dependency-type: "development"
      npm-runtime-deps:
        dependency-type: "production"

  # GitHub Actions 版本（.github/workflows/*）
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # 所有 actions 更新合并为一个 PR
      github-actions:
        patterns:
          - "*"
