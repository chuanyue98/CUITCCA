        type: static
        title: "学校历史"
        urls: ["/xygk/xxls.htm"]
      - name: xrld
        category: "学校概况"
        type: static
        title: "现任领导"
        urls: ["/xygk/xrld.htm"]
      - name: zzjg
        category: "组织机构"
        type: static
        title: "组织机构"
        urls: ["/zzjg.htm"]
      - name: szgk
        category: "师资队伍"
