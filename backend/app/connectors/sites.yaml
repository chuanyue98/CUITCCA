  # 本科招生网。2026-08 从当前开发/CI 网络环境实测：TLS 握手阶段即失败
  # （SSL_ERROR_SYSCALL / ConnectError），main 站点与其余二级站点均可正常
  # 访问，问题定位在这一个域名的出站连通性（具体原因未知：可能是该域名的
  # 服务端 TLS 配置问题，也可能是运行环境对这个特定主机的网络限制）。
  # 站点结构因此未探测、sections 留空。换一个能连通该域名的网络环境后，
  # 参考本文件其它站点的写法实测 HTML 结构、补充 sections，再把 enabled
  # 改成 true 即可加入抓取范围，代码不需要改动。
  - name: zjc
    display_name: "本科招生网"
    base_url: "https://zjc.cuit.edu.cn"
    enabled: false
    disabled_reason: "TLS 握手失败（SSL_ERROR_SYSCALL），当前网络环境无法连通，站点结构未探测"
    sections: []

  # 一网通办。2026-08 实测：HTTP 200 但返回的是纯前端 Vue SPA 骨架（index.html
  # 里只有一个空的 #app 挂载点，实际内容由浏览器执行 JS 后异步渲染），本连接器
  # 基于 httpx+BeautifulSoup 的静态 HTML 抓取方式拿不到任何正文，需要无头浏览器
  # （比如 Playwright）才能渲染出内容——这类站点超出当前连接器的设计范围
  # （见 docs/data-sources.md 的"已知限制"一节），先占位记录，不纳入抓取。
  - name: ywtb
    display_name: "一网通办"
    base_url: "https://ywtb.cuit.edu.cn"
    enabled: false
    disabled_reason: "纯前端 SPA，静态 HTML 抓取拿不到内容，需要无头浏览器渲染，超出当前连接器范围"
    sections: []
