# CUIT 站群连接器配置：站点 -> 栏目 -> 抓取规则。
#
# 设计原则：新增一个栏目或站点只改这个文件，不碰 backend/app/connectors/*.py
# 里的代码——URL 模板、分页规律、正文选择器全部数据化。
#
# 已实测确认的站点结构（2026-08，见 docs/data-sources.md 的复现记录）：
# CUIT 官网 www.cuit.edu.cn 及共用同一套"网站群"CMS 模板的二级站点
# （jwc/gjjl/xyw.cuit.edu.cn）结构一致：
#   - 详情页固定形如 base_url/info/<栏目ID>/<文章ID>.htm
#   - 正文容器：div.v_news_content（外层套 div#vsb_content，再外层 div.article）
#   - 标题：h2.tit
#   - 来源/作者/日期：p.conttime，形如 "日期：2026-08-05"
#   - 列表页条目：ul.list > li > a[href]，标题在 <a title="...">，
#     发布日期在 <a> 内的 <span>2026-08-05</span>
#   - 分页是"倒序编号"：第 1 页是不带编号的 <index>.htm，第 2 页开始是
#     <index>/<N-1>.htm、<index>/<N-2>.htm ... 一直到 <index>/1.htm
#     （N 为总页数）。总页数会在运行时从第 1 页的翻页控件自动解析
#     （见 extract.discover_total_pages），这里配的 total_pages 只是
#     "已知值优先"的显式声明/性能优化，留空（不写这个字段）也能正常工作。
#
# 不适配这套模板的站点（zjc.cuit.edu.cn 网络不可达、ywtb.cuit.edu.cn 是纯前
# 端 SPA 无法静态抓取）在文末以 enabled: false 占位记录，见字段说明。

defaults:
  # 必须是纯 ASCII：HTTP header 值不允许非 ASCII 字符，httpx 会在
  # build_request 阶段直接抛 UnicodeEncodeError（这里原本写的是中文说明，
  # 一发请求就崩）。声明内容用英文表达等价含义：非商业教育用途、附联系方式。
  user_agent: "CUITCCA-EduBot/0.1 (+https://github.com/chuanyue98/CUITCCA; non-commercial campus knowledge-base demo; respects robots.txt and rate limits)"
  request_interval_seconds: 1.2
  max_concurrency: 2
  timeout_seconds: 15
  max_retries: 3
  retry_backoff_seconds: 1.5
  detail_content_selector: "div.v_news_content, div#vsb_content, div.article, div.wp_articlecontent"
  detail_title_selector: "h2.tit, h1.tit, h1"
  detail_date_selector: "p.conttime, span.conttime"
  list_item_selector: "ul.list li a[href]"
  default_max_pages: 5

sites:
  - name: main
    display_name: "成都信息工程大学官网"
    base_url: "https://www.cuit.edu.cn"
    sections:
