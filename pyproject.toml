[project]
name = "cuitcca"
version = "0.2.0"
description = "校园AI助手 - CUIT Campus AI Assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.0",
    "uvicorn>=0.50.2",
    "python-dotenv>=1.1.0",
    "python-multipart>=0.0.32",
    "pydantic[email]>=2.9.0",
    "aiofiles>=24.1.0",
    "openai>=2.45.0",
    "llama-index-core>=0.14.23",
    "llama-index-embeddings-huggingface>=0.5.0",
    "llama-index-llms-openai-like>=0.4.0",
    "llama-index-vector-stores-chroma>=0.3.0",
    "chromadb>=0.6.0,<2.0",
    "pandas>=2.2.3",
    "python-docx>=1.1.0",
    "pdfplumber>=0.11.10",
    "tiktoken>=0.13.0",
    "orjson>=3.11.9",
    "PyYAML>=6.0.3",
    "networkx>=3.6.1",
    "xlrd>=2.0.2",
    "XlsxWriter>=3.2.9",
    "tqdm>=4.68.3",
    "llama-index-readers-file>=0.6.0",
    "nltk==3.10.3",
    "transformers==5.15.0",
    # SimpleDirectoryReader 解析 docx/xlsx 的实际依赖：ALLOWED_EXTENSIONS 允许上传
    # 这两类文件，缺了这两个包线上 insert_into_index 会直接 ImportError（Phase 0 发现的 bug）
    "docx2txt>=0.8",
    "openpyxl>=3.1",
    # LlamaIndex 可观测性（Phase 1）：OpenInference instrumentation + OTLP 导出，
    # 环境变量门控，见 backend/app/configs/observability.py 与 docs/observability.md
    "openinference-instrumentation-llama-index>=3.0",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
    "jieba>=0.42.1",
    "bm25s>=0.3.9",
    # Rerank（Phase C）：本地 cross-encoder 重排（bge-reranker-v2-m3）。曾经是
    # 可选的 rerank 依赖组，evals/run_rerank_eval.py 和 run_hybrid_eval.py 的
    # C 组都验证过收益后提为主依赖，RERANK_ENABLED 默认打开。
    "sentence-transformers>=3.0",
    # 文档解析扩展（多格式摄取）。原 ALLOWED_EXTENSIONS 只有 6 种格式，语料库
    # 里 21% 的文件（.doc/.pptx/.xls/图片）被静默跳过，这几个包补齐解析能力：
    # - olefile   : .doc/.xls 等 OLE2 复合文档的容器读取（旧版 Office 二进制格式）
    # - python-pptx: .pptx 幻灯片文本与表格抽取
    # - beautifulsoup4 / lxml: HTML 正文抽取（Web 连接器抓回来的页面）
    "olefile>=0.47",
    "python-pptx>=1.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    # Web 数据连接器：抓取校园站群公开页面（带并发与重试）
    "httpx>=0.27",
]

[project.optional-dependencies]
# OCR（可选）：扫描件 PDF 与流程图图片的文字识别。模型约 100MB，只有 4 个图片
# 语料文件需要，因此不进主依赖——未安装时 image 解析器降级为"显式报告不可用"，
# 而不是静默跳过（见 backend/app/handlers/parsers/）。
# 安装：uv sync --extra ocr
ocr = [
    "rapidocr-onnxruntime>=1.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "bandit>=1.7",
]

[project.urls]
Homepage = "https://github.com/ChuanYuei/CUITCCA"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=backend/app --cov-report=term"
markers = [
    "eval: marks tests that run real retrieval/generation evaluations against a local Chroma index and/or a configured LLM (see evals/README.md); not run by default in CI, deselect explicitly with -m 'not eval' if ever mixed into the default suite.",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["N802", "N803", "N806", "UP042"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
