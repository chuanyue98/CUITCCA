<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./icon.png" type="image/x-icon">
    <link rel="stylesheet" href="./style.css">
    <title>成信大校园助手 — 知识库编辑台</title>
</head>
<body class="console-page">
    <!-- 全局加载遮罩 -->
    <div id="loading-overlay">
        <div class="spinner"></div>
        <div class="loading-text">正在处理中...</div>
    </div>

    <div class="outline">
        <!-- 左侧边栏（sidebar.ts 注入） -->
        <nav id="side_left"></nav>

        <!-- 右侧工作区 -->
        <main class="side_right">
            <!-- Editorial Masthead -->
            <header class="console_masthead">
                <div class="masthead_brand">
                    <button id="button" class="masthead_toggle" aria-label="切换侧栏">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5M3.75 17.25h16.5"/>
                        </svg>
                    </button>
                    <div class="masthead_wordmark">
                        <span class="eyebrow">校园知识库管理台</span>
                        <h1 class="masthead_title">知识库<em>编辑台</em></h1>
                    </div>
                </div>
                <div class="masthead_meta">
                    <span class="meta_kv"><span class="meta_k">版本</span><span class="meta_v">v0.2.0</span></span>
                    <span class="meta_kv"><span class="meta_k">会话</span><span class="meta_v">本地</span></span>
                </div>
            </header>

            <!-- 核心内容工作区 -->
            <div class="dashboard_container">
                <!-- 左面板 -->
                <div class="panel_left" id="panel-left-container">
                    <!-- § 01 索引管理 -->
                    <section class="console_panel">
                        <header class="console_panel_head">
                            <span class="section_no">§ 01</span>
                            <div class="console_panel_title_group">
                                <span class="eyebrow">索引注册表</span>
                                <h2 class="console_panel_title">活跃知识库索引</h2>
                            </div>
                        </header>

                        <div class="index_action_row">
                            <label class="field_label" for="index-select">索引</label>
                            <select id="index-select" class="index_select">
                                <option value="">加载中...</option>
                            </select>
                            <button class="btn btn-primary btn_save_disk" title="将内存中的索引变更写入磁盘永久存储">保存到磁盘</button>
                        </div>

                        <div class="index_create_row">
                            <input type="text" id="new-index-name" class="new_index_input" placeholder="输入新索引名称…" maxlength="64">
                            <button class="btn btn-success">新建索引</button>
                            <button class="btn btn-danger">删除当前索引</button>
                        </div>

                        <!-- 索引摘要 Summary -->
                        <div class="summary_section">
                            <div class="summary_header">
                                <span class="summary_label">索引摘要 <span class="summary_label_en">/ 用于让检索更精准</span></span>
                                <span id="summary-status-tag" class="status_tag">未做修改</span>
                            </div>
                            <textarea id="index-summary-textarea" class="summary_textarea" placeholder="选择或载入索引以编辑其摘要…"></textarea>
                        </div>
                    </section>

                    <!-- § 02 数据导入 -->
                    <section class="console_panel">
                        <header class="console_panel_head">
                            <span class="section_no">§ 02</span>
                            <div class="console_panel_title_group">
                                <span class="eyebrow">数据导入</span>
                                <h2 class="console_panel_title">数据导入</h2>
                            </div>
                        </header>

                        <div class="tabs_header">
                            <button class="tab_btn active" data-tab="tab-upload">文件上传</button>
                            <button class="tab_btn" data-tab="tab-text">文本录入</button>
                            <button class="tab_btn" data-tab="tab-qa">QA 生成导入</button>
                        </div>

                        <!-- Tab 1: 文件拖拽上传 -->
                        <div id="tab-upload" class="tab_content active">
                            <div class="drag_zone" id="drag-zone">
                                <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.25" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5M16.5 12 12 16.5m0 0L7.5 12m4.5 4.5V3"/>
                                </svg>
                                <p class="drag_zone_main_text">拖拽 TXT / PDF / Markdown 文件到这里，或点击选择</p>
                                <p class="drag_zone_hint_text">支持多文件一次性上传与自动解析分块</p>
                            </div>
                            <input type="file" id="file-input" multiple accept=".txt,.pdf,.md,.csv,.xlsx,.docx" class="file_input_hidden">
                            <div id="upload-progress-list" class="upload_progress_list"></div>
                        </div>

                        <!-- Tab 2: 直接文本录入 -->
                        <div id="tab-text" class="tab_content">
                            <div class="form_group">
                                <label for="input-doc-id">文档标识符 <span class="field_hint">可选 · 留空系统自动生成</span></label>
                                <input type="text" id="input-doc-id" placeholder="例如：rule_dormitory_v1（留空则系统自动生成）">
                            </div>
                            <div class="form_group">
                                <label for="input-doc-text">文档正文 <span class="field_hint">必填</span></label>
                                <textarea id="input-doc-text" rows="6" placeholder="请输入要索引的内容文本…"></textarea>
                            </div>
                            <button class="btn-submit">插入文档</button>
                        </div>

                        <!-- Tab 3: QA 生成式上传 -->
                        <div id="tab-qa" class="tab_content">
                            <div class="form_group">
                                <label for="qa-file-input">选择数据源文件 <span class="field_hint">TXT / MD 等</span></label>
                                <input type="file" id="qa-file-input" accept=".txt,.pdf,.md,.csv,.xlsx,.docx">
                            </div>
                            <div class="form_group">
                                <label for="qa-custom-prompt">QA 抽取提示词 <span class="field_hint">可选 · 留空用默认</span></label>
                                <textarea id="qa-custom-prompt" rows="3" placeholder="默认会将文件内容切割为多块，并为每块生成对应的标准问答对…"></textarea>
                            </div>
                            <button class="btn-submit btn-submit-qa">生成 QA 并导入</button>
                        </div>
                    </section>
                </div>

                <!-- 右面板：节点浏览器 -->
                <section class="panel_right" id="panel-right-container">
                    <div class="node_search_header">
                        <header class="console_panel_head console_panel_head--inline">
                            <span class="section_no">§ 03</span>
                            <div class="console_panel_title_group">
                                <span class="eyebrow">数据分块浏览器</span>
                                <h2 class="console_panel_title">数据分块浏览器</h2>
                            </div>
                        </header>
                        <input type="text" id="node-search" class="node_search_input" placeholder="搜索关键词 / Doc ID…">
                    </div>

                    <!-- 节点展示主区 -->
                    <div id="node-list-viewport" class="node_list_viewport">
                        <div class="node_empty_hint">选择或载入索引以查看分块数据</div>
                    </div>

                    <!-- 分页控制栏 -->
                    <div id="pagination-bar">
                        <span id="page-indicator" class="page_indicator">第 1 / 1 页 · 共 0 项</span>
                        <div class="pagination_buttons">
                            <button id="btn-prev-page" class="pagination_btn">上一页</button>
                            <button id="btn-next-page" class="pagination_btn">下一页</button>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Toast 通知浮层 -->
    <div id="toast-container"></div>

    <script type="module" src="./src/sidebar.ts" data-active="manage"></script>
    <script type="module" src="./src/manage.ts"></script>
</body>
</html>
